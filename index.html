<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora RF Transportes</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #a855f7 100%);
            min-height: 100vh;
            padding: 0;
            color: #333;
        }

        .wrapper {
            display: flex;
            min-height: 100vh;
            justify-content: center;
            align-items: flex-start;
            padding: 20px;
        }

        .main-content {
            width: 100%;
            max-width: 1000px;
        }

        .container {
            width: 100%;
        }

        .header-section {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 50px 40px;
            margin-bottom: 30px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        .header-title {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 15px;
        }

        .header-icon {
            font-size: 2.5em;
        }

        .header-section h1 {
            font-size: 2.2em;
            font-weight: 700;
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin: 0;
        }

        .header-section p {
            font-size: 0.95em;
            color: #666;
            margin-top: 10px;
            margin-bottom: 0;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            border: 1px solid #f0f0f0;
            transition: all 0.3s;
        }

        .card:hover {
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
            border-color: #e0e0e0;
        }

        .card-title {
            font-size: 1.2em;
            font-weight: 600;
            color: #333;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .card-title-icon {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 0.9em;
        }

        .input-group {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 20px;
            margin-bottom: 25px;
        }

        .input-field {
            display: flex;
            flex-direction: column;
        }

        .input-field label {
            font-size: 0.85em;
            font-weight: 600;
            color: #555;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-field input {
            padding: 12px 15px;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            font-size: 0.95em;
            transition: all 0.3s;
            background: #f8f9fa;
        }

        .input-field input:focus {
            outline: none;
            border-color: #6366f1;
            background: white;
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 30px;
        }

        button {
            flex: 1;
            padding: 14px 20px;
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.95em;
            font-weight: 600;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .result-card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            border-left: 5px solid #6366f1;
            transition: all 0.3s;
        }

        .result-card:hover {
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
        }

        .truck-name {
            font-size: 1.3em;
            font-weight: 700;
            color: #6366f1;
            margin-bottom: 8px;
        }

        .truck-info {
            font-size: 0.85em;
            color: #999;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid #f0f0f0;
        }

        .stacking-content {
            font-size: 0.9em;
            line-height: 1.8;
            color: #555;
            white-space: pre-wrap;
            word-wrap: break-word;
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            border-left: 3px solid #8b5cf6;
        }

        .stacking-content strong {
            font-weight: 600;
            color: #333;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #999;
        }

        .empty-state-icon {
            font-size: 3em;
            margin-bottom: 15px;
            opacity: 0.5;
        }

        .empty-state p {
            font-size: 0.95em;
        }

        .alert-warning {
            background: #fff3cd;
            border: 2px solid #ffc107;
            color: #856404;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            font-weight: 500;
            margin-bottom: 20px;
        }

        .alert-success {
            background: #d4edda;
            border: 2px solid #28a745;
            color: #155724;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            font-weight: 500;
            margin-bottom: 20px;
        }

        .alert-info {
            background: #d1ecf1;
            border: 2px solid #17a2b8;
            color: #0c5460;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            font-weight: 500;
            margin-bottom: 20px;
        }

        .results-header {
            font-size: 1.1em;
            font-weight: 600;
            color: #333;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .results-header-icon {
            width: 28px;
            height: 28px;
            background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 0.8em;
        }

        /* Combination cards */
        .combination-card {
            background: white;
            border-radius: 12px;
            margin-bottom: 16px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            border-left: 5px solid #17a2b8;
            overflow: hidden;
            transition: all 0.3s;
        }

        .combination-card:hover {
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
        }

        .combo-summary {
            padding: 20px 25px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .combo-summary:hover {
            background: #f8f9fa;
        }

        .combo-rank {
            background: linear-gradient(135deg, #17a2b8 0%, #20c997 100%);
            color: white;
            font-weight: 700;
            font-size: 0.85em;
            padding: 4px 10px;
            border-radius: 20px;
            white-space: nowrap;
        }

        .combo-trucks {
            font-weight: 700;
            color: #333;
            font-size: 1.1em;
            flex: 1;
        }

        .combo-util {
            font-size: 0.85em;
            color: #666;
            background: #f0f0f0;
            padding: 4px 12px;
            border-radius: 20px;
            white-space: nowrap;
        }

        .combo-split {
            padding: 0 25px 15px;
            font-size: 0.85em;
            color: #888;
            cursor: pointer;
        }

        .combo-expand-hint {
            padding: 0 25px 15px;
            font-size: 0.8em;
            color: #17a2b8;
            cursor: pointer;
            font-weight: 500;
        }

        .combination-detail {
            border-top: 1px solid #f0f0f0;
            padding: 20px 25px;
            background: #fafbfc;
        }

        .combination-detail .result-card {
            margin-bottom: 15px;
            border-left-color: #17a2b8;
        }

        .combination-detail .result-card:last-child {
            margin-bottom: 0;
        }

        .combination-detail .truck-name {
            color: #17a2b8;
        }

        @media (max-width: 768px) {
            .wrapper {
                padding: 15px;
            }

            .header-section {
                padding: 30px 20px;
                margin-bottom: 20px;
            }

            .header-section h1 {
                font-size: 1.6em;
            }

            .header-icon {
                font-size: 2em;
            }

            .card {
                padding: 20px;
            }

            .input-group {
                grid-template-columns: 1fr;
                gap: 15px;
            }

            .button-group {
                flex-direction: column;
            }

            .result-card {
                padding: 20px;
            }

            .truck-name {
                font-size: 1.1em;
            }

            .stacking-content {
                font-size: 0.85em;
            }

            .combo-summary {
                padding: 15px 20px;
            }

            .combo-trucks {
                font-size: 1em;
            }

            .combo-split, .combo-expand-hint {
                padding-left: 20px;
                padding-right: 20px;
            }

            .combination-detail {
                padding: 15px 20px;
            }
        }

        @media (max-width: 480px) {
            .wrapper {
                padding: 10px;
            }

            .header-section {
                padding: 20px 15px;
            }

            .header-section h1 {
                font-size: 1.4em;
            }

            .header-icon {
                font-size: 1.8em;
            }

            .card {
                padding: 15px;
            }

            .card-title {
                font-size: 1em;
            }

            .result-card {
                padding: 15px;
            }

            .truck-name {
                font-size: 1em;
            }

            .stacking-content {
                font-size: 0.8em;
            }

            .combo-summary {
                padding: 12px 15px;
                gap: 10px;
            }

            .combo-split, .combo-expand-hint {
                padding-left: 15px;
                padding-right: 15px;
            }

            .combination-detail {
                padding: 12px 15px;
            }
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="main-content">
            <div class="container">
                <div class="header-section">
                    <div class="header-title">
                        <div class="header-icon">📦</div>
                        <h1>RF Transportes</h1>
                    </div>
                    <p>Calculadora de Volumes - Otimize o empilhamento e verifique a compatibilidade com sua frota</p>
                </div>

                <div class="card">
                    <div class="card-title">
                        <div class="card-title-icon">📋</div>
                        Quantidade de Carga
                    </div>
                    <div class="input-group">
                        <div class="input-field">
                            <label for="cx_qty">Engradados (cx)</label>
                            <input type="number" id="cx_qty" value="0" min="0">
                        </div>
                        <div class="input-field">
                            <label for="caixotao_qty">Caixotões</label>
                            <input type="number" id="caixotao_qty" value="0" min="0">
                        </div>
                        <div class="input-field">
                            <label for="ifco_qty">IFCOs</label>
                            <input type="number" id="ifco_qty" value="0" min="0">
                        </div>
                    </div>
                    <div class="button-group">
                        <button onclick="calcularVolume()">🔍 Calcular Compatibilidade</button>
                    </div>
                </div>

                <div id="results">
                    <div class="empty-state">
                        <div class="empty-state-icon">📦</div>
                        <p>Insira as quantidades e clique em "Calcular Compatibilidade".</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ========== DADOS ==========

        const CARGO_DIMS = {
            cx: { c: 55.0, a: 30.0, l: 36.0, nome: "Engradado (cx)" },
            caixotao: { c: 77.5, a: 30.0, l: 57.5, nome: "Caixotão" },
            ifco: { c: 60.0, a: 25.0, l: 39.0, nome: "IFCO" }
        };

        const TRUCK_DIMS_M = [
            { nome: "Mini", c: 2.90, l: 1.66, a: 1.65 },
            { nome: "Azul", c: 2.80, l: 1.82, a: 1.83 },
            { nome: "Grandão", c: 3.16, l: 1.68, a: 2.13 },
            { nome: "Big", c: 3.30, l: 1.80, a: 2.15 },
            { nome: "Esquentadinho", c: 3.45, l: 1.92, a: 2.60 },
            { nome: "Novinho", c: 3.92, l: 2.07, a: 1.78 }
        ];

        const TRUCK_DIMS = TRUCK_DIMS_M.map(truck => ({
            nome: truck.nome,
            c: truck.c * 100,
            l: truck.l * 100,
            a: truck.a * 100,
            volume_m3: (truck.c * truck.l * truck.a).toFixed(2)
        })).sort((a, b) => a.c * a.l * a.a - b.c * b.l * b.a);

        // ========== UTILITARIOS ==========

        function markdownToHtml(text) {
            return text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
        }

        function getPermutations(arr) {
            if (arr.length <= 1) return [arr];
            const result = [];
            for (let i = 0; i < arr.length; i++) {
                const rest = [...arr.slice(0, i), ...arr.slice(i + 1)];
                for (const perm of getPermutations(rest)) {
                    result.push([arr[i], ...perm]);
                }
            }
            return result;
        }

        function cartesianProduct(arrays) {
            if (arrays.length === 0) return [[]];
            return arrays.reduce((acc, curr) => {
                const result = [];
                for (const a of acc) {
                    for (const b of curr) {
                        result.push([...a, b]);
                    }
                }
                return result;
            }, [[]]);
        }

        // Gera todas as orientacoes validas de uma caixa dentro de um caminhao
        // Caixas sao abertas em cima (hortalicas), so permite rotacao horizontal.
        // A altura (a) sempre fica para cima. Testa 2 orientacoes: c/l e l/c no chao.
        function getValidOrientations(cargo, truckHeight, truckWidth) {
            const orientations = [];
            const up = cargo.a;

            if (up > truckHeight) return orientations;

            let maxStack;
            if (cargo.id === 'ifco') {
                maxStack = Math.min(5, Math.floor(truckHeight / up));
            } else {
                maxStack = Math.floor(truckHeight / up);
            }
            if (maxStack === 0) return orientations;

            // Orientacao 1: c no comprimento, l na largura
            if (cargo.l <= truckWidth) {
                orientations.push({ along: cargo.c, across: cargo.l, up, maxStack });
            }

            // Orientacao 2: l no comprimento, c na largura (rotacionado 90 graus)
            if (cargo.c <= truckWidth && (cargo.c !== cargo.l)) {
                orientations.push({ along: cargo.l, across: cargo.c, up, maxStack });
            }

            return orientations;
        }

        // ========== ALGORITMO DE EMPACOTAMENTO ==========

        // Tenta empacotar uma lista ordenada de cargas em um caminhao
        function tryPackOrdering(truck, orderedCargoList) {
            let remainingLength = truck.c;
            const placements = [];
            let totalVolumeUsed = 0;

            for (const cargo of orderedCargoList) {
                if (cargo.qty === 0) continue;

                const orientations = getValidOrientations(cargo, truck.a, truck.l);
                if (orientations.length === 0) {
                    return { fits: false };
                }

                let bestOri = null;
                let bestLength = Infinity;
                let bestGap = Infinity;
                let bestStacksPerRow = 0;
                let bestRows = 0;

                for (const ori of orientations) {
                    const stacksPerRow = Math.floor(truck.l / ori.across);
                    if (stacksPerRow === 0) continue;

                    const stacksNeeded = Math.ceil(cargo.qty / ori.maxStack);
                    const rows = Math.ceil(stacksNeeded / stacksPerRow);
                    const lengthNeeded = rows * ori.along;
                    const gap = truck.l - (stacksPerRow * ori.across);

                    if (lengthNeeded < bestLength || (lengthNeeded === bestLength && gap < bestGap)) {
                        bestOri = ori;
                        bestLength = lengthNeeded;
                        bestGap = gap;
                        bestStacksPerRow = stacksPerRow;
                        bestRows = rows;
                    }
                }

                if (!bestOri || bestLength > remainingLength) {
                    return { fits: false };
                }

                remainingLength -= bestLength;
                totalVolumeUsed += cargo.qty * cargo.c * cargo.a * cargo.l;

                placements.push({
                    cargoId: cargo.id,
                    cargoNome: cargo.nome,
                    qty: cargo.qty,
                    orientation: bestOri,
                    rows: bestRows,
                    stacksPerRow: bestStacksPerRow,
                    lengthUsed: bestLength,
                    gapWidth: bestGap
                });
            }

            const totalTruckVolume = truck.c * truck.l * truck.a;
            const utilization = totalVolumeUsed / totalTruckVolume;

            return {
                fits: true,
                utilization,
                volumeUsed: totalVolumeUsed,
                totalTruckVolume,
                remainingLength,
                placements
            };
        }

        // Testa todas as permutacoes de ordem de carga e retorna o melhor resultado
        function packCargoInTruck(truck, cargoList) {
            const activeCargo = cargoList.filter(c => c.qty > 0);
            if (activeCargo.length === 0) {
                return {
                    fits: true,
                    utilization: 0,
                    volumeUsed: 0,
                    totalTruckVolume: truck.c * truck.l * truck.a,
                    remainingLength: truck.c,
                    placements: []
                };
            }

            const permutations = getPermutations(activeCargo);
            let bestResult = { fits: false };

            for (const perm of permutations) {
                const result = tryPackOrdering(truck, perm);
                if (result.fits) {
                    if (!bestResult.fits || result.utilization > bestResult.utilization) {
                        bestResult = result;
                    }
                }
            }

            return bestResult;
        }

        // ========== MULTI-CAMINHAO ==========

        function generateSplits(cargoList) {
            const splitFractions = [0, 0.25, 0.5, 0.75, 1.0];

            const typeSplits = cargoList.map(cargo => {
                const splits = new Set();
                for (const frac of splitFractions) {
                    splits.add(Math.round(cargo.qty * frac));
                }
                return [...splits];
            });

            const combos = cartesianProduct(typeSplits);

            return combos.map(combo => {
                const split1 = cargoList.map((c, i) => ({ ...c, qty: combo[i] }));
                const split2 = cargoList.map((c, i) => ({ ...c, qty: c.qty - combo[i] }));
                return [split1, split2];
            });
        }

        function scoreCombination(combo) {
            const totalWasted = combo.trucks.reduce((sum, t) => {
                return sum + (t.packingResult.totalTruckVolume - t.packingResult.volumeUsed);
            }, 0);
            const truckSizePenalty = combo.trucks.reduce((sum, t) => {
                return sum + t.packingResult.totalTruckVolume;
            }, 0);
            return totalWasted + truckSizePenalty * 0.1;
        }

        function findMultiTruckCombinations(cargoList) {
            // Para cada par de caminhoes, guarda apenas a melhor divisao de carga
            const bestPerPair = {};
            const splits = generateSplits(cargoList);

            for (let i = 0; i < TRUCK_DIMS.length; i++) {
                for (let j = i; j < TRUCK_DIMS.length; j++) {
                    const truck1 = TRUCK_DIMS[i];
                    const truck2 = TRUCK_DIMS[j];
                    const pairKey = `${truck1.nome} + ${truck2.nome}`;

                    for (const [split1, split2] of splits) {
                        const total1 = split1.reduce((s, c) => s + c.qty, 0);
                        const total2 = split2.reduce((s, c) => s + c.qty, 0);
                        if (total1 === 0 || total2 === 0) continue;

                        const result1 = packCargoInTruck(truck1, split1);
                        const result2 = packCargoInTruck(truck2, split2);

                        if (result1.fits && result2.fits) {
                            const combo = {
                                trucks: [
                                    {
                                        truck: truck1,
                                        packingResult: result1,
                                        cargoCounts: Object.fromEntries(split1.map(c => [c.id, c.qty]))
                                    },
                                    {
                                        truck: truck2,
                                        packingResult: result2,
                                        cargoCounts: Object.fromEntries(split2.map(c => [c.id, c.qty]))
                                    }
                                ]
                            };
                            combo.score = scoreCombination(combo);

                            const totalVolume = combo.trucks.reduce((s, t) => s + t.packingResult.totalTruckVolume, 0);
                            const totalUsed = combo.trucks.reduce((s, t) => s + t.packingResult.volumeUsed, 0);
                            combo.totalUtilization = totalUsed / totalVolume;
                            combo.pairKey = pairKey;

                            // Guarda so a melhor divisao para este par
                            if (!bestPerPair[pairKey] || combo.score < bestPerPair[pairKey].score) {
                                bestPerPair[pairKey] = combo;
                            }
                        }
                    }
                }
            }

            const combinations = Object.values(bestPerPair);
            combinations.sort((a, b) => a.score - b.score);
            return combinations.slice(0, 5);
        }

        // ========== RENDERIZACAO ==========

        function formatPackingDescription(truck, packingResult) {
            let text = `Empilhamento otimizado para **${truck.nome}** (${truck.c/100}m C x ${truck.l/100}m L x ${truck.a/100}m A):\n\n`;

            for (const p of packingResult.placements) {
                text += `  - **${p.cargoNome}** (Qtd: ${p.qty}): Ocupa **${p.lengthUsed.toFixed(0)}cm** do comprimento.\n`;
                text += `    - Orientacao: ${p.orientation.along.toFixed(0)}cm no comprimento, ${p.orientation.across.toFixed(0)}cm na largura, ${p.orientation.up.toFixed(0)}cm na altura.\n`;
                text += `    - ${p.rows} fileira(s) com ${p.stacksPerRow} pilha(s) lado a lado.\n`;
                text += `    - Cada pilha: ate ${p.orientation.maxStack} unidade(s) de altura.\n`;
                if (p.gapWidth > 0) {
                    text += `    - Sobra na largura: ${p.gapWidth.toFixed(0)}cm.\n`;
                }
                text += '\n';
            }

            text += `**Comprimento Restante:** ${packingResult.remainingLength.toFixed(0)}cm\n`;
            text += `**Utilizacao de Volume:** ${(packingResult.utilization * 100).toFixed(1)}%\n`;

            return text;
        }

        function renderSingleTruckResult(truck, packingResult) {
            const description = formatPackingDescription(truck, packingResult);
            const htmlDesc = markdownToHtml(description);
            return `
                <div class="result-card">
                    <div class="truck-name">🚚 ${truck.nome}</div>
                    <div class="truck-info">Dimensoes: ${truck.c/100}m C x ${truck.l/100}m L x ${truck.a/100}m A | Volume: ${truck.volume_m3} m³</div>
                    <div class="stacking-content">${htmlDesc}</div>
                </div>
            `;
        }

        function formatCargoSplit(cargoCounts, cargoList) {
            const parts = [];
            for (const cargo of cargoList) {
                const qty = cargoCounts[cargo.id] || 0;
                if (qty > 0) {
                    parts.push(`${qty}x ${cargo.nome}`);
                }
            }
            return parts.join(', ');
        }

        function renderCombinationCards(combinations, cargoList) {
            let html = '';

            combinations.forEach((combo, index) => {
                const t1 = combo.trucks[0];
                const t2 = combo.trucks[1];
                const split1Text = formatCargoSplit(t1.cargoCounts, cargoList);
                const split2Text = formatCargoSplit(t2.cargoCounts, cargoList);
                const utilText = (combo.totalUtilization * 100).toFixed(1);

                const detail1 = formatPackingDescription(t1.truck, t1.packingResult);
                const detail2 = formatPackingDescription(t2.truck, t2.packingResult);

                html += `
                    <div class="combination-card">
                        <div class="combo-summary" onclick="toggleComboDetail(${index})">
                            <span class="combo-rank">#${index + 1}</span>
                            <span class="combo-trucks">🚚 ${t1.truck.nome} + 🚚 ${t2.truck.nome}</span>
                            <span class="combo-util">Utilizacao: ${utilText}%</span>
                        </div>
                        <div class="combo-split" onclick="toggleComboDetail(${index})">
                            ${t1.truck.nome}: ${split1Text} | ${t2.truck.nome}: ${split2Text}
                        </div>
                        <div class="combo-expand-hint" onclick="toggleComboDetail(${index})" id="combo-hint-${index}">
                            ▶ Clique para ver o plano de armazenamento
                        </div>
                        <div class="combination-detail" id="combo-detail-${index}" style="display:none;">
                            <div class="result-card">
                                <div class="truck-name">🚚 ${t1.truck.nome}</div>
                                <div class="truck-info">Dimensoes: ${t1.truck.c/100}m C x ${t1.truck.l/100}m L x ${t1.truck.a/100}m A | Volume: ${t1.truck.volume_m3} m³</div>
                                <div class="stacking-content">${markdownToHtml(detail1)}</div>
                            </div>
                            <div class="result-card">
                                <div class="truck-name">🚚 ${t2.truck.nome}</div>
                                <div class="truck-info">Dimensoes: ${t2.truck.c/100}m C x ${t2.truck.l/100}m L x ${t2.truck.a/100}m A | Volume: ${t2.truck.volume_m3} m³</div>
                                <div class="stacking-content">${markdownToHtml(detail2)}</div>
                            </div>
                        </div>
                    </div>
                `;
            });

            return html;
        }

        function toggleComboDetail(index) {
            const detail = document.getElementById(`combo-detail-${index}`);
            const hint = document.getElementById(`combo-hint-${index}`);
            if (detail.style.display === 'none') {
                detail.style.display = 'block';
                hint.textContent = '▼ Ocultar plano de armazenamento';
            } else {
                detail.style.display = 'none';
                hint.textContent = '▶ Clique para ver o plano de armazenamento';
            }
        }

        // ========== FUNCAO PRINCIPAL ==========

        function calcularVolume() {
            const cx_qty = parseInt(document.getElementById('cx_qty').value) || 0;
            const caixotao_qty = parseInt(document.getElementById('caixotao_qty').value) || 0;
            const ifco_qty = parseInt(document.getElementById('ifco_qty').value) || 0;

            const total_items = cx_qty + caixotao_qty + ifco_qty;

            if (total_items === 0) {
                document.getElementById('results').innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📦</div>
                        <p>Insira as quantidades e clique em "Calcular Compatibilidade".</p>
                    </div>
                `;
                return;
            }

            const cargoList = [];
            if (cx_qty > 0) cargoList.push({ ...CARGO_DIMS.cx, qty: cx_qty, id: 'cx' });
            if (caixotao_qty > 0) cargoList.push({ ...CARGO_DIMS.caixotao, qty: caixotao_qty, id: 'caixotao' });
            if (ifco_qty > 0) cargoList.push({ ...CARGO_DIMS.ifco, qty: ifco_qty, id: 'ifco' });

            // Tenta caminhao unico
            let singleTruckHtml = '';
            for (const truck of TRUCK_DIMS) {
                const result = packCargoInTruck(truck, cargoList);
                if (result.fits) {
                    singleTruckHtml += renderSingleTruckResult(truck, result);
                }
            }

            if (singleTruckHtml) {
                document.getElementById('results').innerHTML = `
                    <div class="alert-success">✓ Compativel com os seguintes veiculos (do menor para o maior)</div>
                    ${singleTruckHtml}
                `;
                return;
            }

            // Nenhum caminhao unico cabe — tenta combinacoes de 2
            const combinations = findMultiTruckCombinations(cargoList);

            if (combinations.length > 0) {
                const comboHtml = renderCombinationCards(combinations, cargoList);
                document.getElementById('results').innerHTML = `
                    <div class="alert-info">📦 A carga nao cabe em um unico caminhao. Veja as melhores combinacoes de 2 veiculos:</div>
                    ${comboHtml}
                `;
            } else {
                document.getElementById('results').innerHTML = `
                    <div class="alert-warning">⚠ A carga excede a capacidade de qualquer combinacao de 2 caminhoes da frota.</div>
                `;
            }
        }

        // Inicializa
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('cx_qty').value = 0;
            document.getElementById('caixotao_qty').value = 0;
            document.getElementById('ifco_qty').value = 0;
        });
    </script>
</body>
</html>
